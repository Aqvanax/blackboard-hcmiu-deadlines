<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Ảnh minh họa GIẢ: giao diện và dữ liệu đều là dữ liệu mẫu -->
  <rect width="880" height="520" fill="#e2e8f0"/>
  <!-- thanh trình duyệt -->
  <rect x="0" y="0" width="880" height="40" fill="#cbd5e1"/>
  <circle cx="20" cy="20" r="6" fill="#f87171"/>
  <circle cx="40" cy="20" r="6" fill="#fbbf24"/>
  <circle cx="60" cy="20" r="6" fill="#34d399"/>
  <rect x="90" y="10" width="500" height="20" rx="10" fill="#f8fafc"/>
  <text x="104" y="24" font-size="12" fill="#475569">https://blackboard.hcmiu.edu.vn/webapps/calendar/... (dữ liệu mẫu)</text>

  <!-- trang Calendar giả -->
  <rect x="16" y="52" width="848" height="452" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="88" font-size="20" font-weight="700" fill="#111827">Lịch học kỳ 2026-27: dữ liệu mẫu</text>
  <line x1="40" y1="104" x2="840" y2="104" stroke="#e5e7eb"/>

  <!-- lưới lịch 7 cột x 4 hàng -->
  <g stroke="#e5e7eb" fill="none">
    <rect x="40" y="120" width="800" height="300"/>
    <line x1="154" y1="120" x2="154" y2="420"/>
    <line x1="268" y1="120" x2="268" y2="420"/>
    <line x1="382" y1="120" x2="382" y2="420"/>
    <line x1="496" y1="120" x2="496" y2="420"/>
    <line x1="610" y1="120" x2="610" y2="420"/>
    <line x1="724" y1="120" x2="724" y2="420"/>
    <line x1="40" y1="195" x2="840" y2="195"/>
    <line x1="40" y1="270" x2="840" y2="270"/>
    <line x1="40" y1="345" x2="840" y2="345"/>
  </g>
  <g font-size="11" fill="#9ca3af">
    <text x="50" y="138">T2</text><text x="164" y="138">T3</text><text x="278" y="138">T4</text>
    <text x="392" y="138">T5</text><text x="506" y="138">T6</text><text x="620" y="138">T7</text><text x="734" y="138">CN</text>
    <text x="780" y="138">12/10</text>
  </g>

  <!-- chip sự kiện giả -->
  <rect x="392" y="205" width="98" height="22" rx="5" fill="#dbeafe"/>
  <text x="399" y="220" font-size="11" fill="#1d4ed8">Lab 02 HW 23:59</text>
  <rect x="620" y="280" width="98" height="22" rx="5" fill="#dbeafe"/>
  <text x="627" y="295" font-size="11" fill="#1d4ed8">Quiz 01 23:59</text>
  <rect x="164" y="355" width="98" height="22" rx="5" fill="#fef3c7"/>
  <text x="171" y="370" font-size="11" fill="#92400e">Nộp báo cáo</text>

  <!-- thông báo thành công -->
  <rect x="500" y="404" width="348" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="500" y="404" width="4" height="52" fill="#16a34a"/>
  <text x="516" y="425" font-size="13" fill="#111827">Đã tải blackboard-deadlines-2026-10-10.ics</text>
  <text x="516" y="444" font-size="13" fill="#111827">(3 deadline, dữ liệu mẫu).</text>

  <!-- hai nút nổi góc dưới phải -->
  <rect x="500" y="462" width="170" height="34" rx="8" fill="#1f2937"/>
  <text x="585" y="484" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Xuất deadline (.ics)</text>
  <rect x="678" y="462" width="170" height="34" rx="8" fill="#1f2937"/>
  <text x="763" y="484" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Đồng bộ Google Calendar</text>
</svg>
